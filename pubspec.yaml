name: jiaba_move
description: "呷飽來動 (JiaBaMove) - 個人專用健身規劃與拍照熱量分析 iOS App"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Secure Storage (iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Media & Image Processing
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Network
  dio: ^5.4.3+1

  # Local Persistence (Local-First)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Vector Animations (Lottie)
  lottie: ^3.1.2
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/exercises/
